name: Offline PR checks

on:
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

env:
  OPENAI_API_KEY: ""
  OPENAI_BASE_URL: ""
  GOOGLE_API_KEY: ""
  PYTHONUTF8: "1"

jobs:
  frozen-ledger:
    name: Frozen ledger bytes (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    timeout-minutes: 10
    env:
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
      GEMINI_API_KEY: ""
      DEEPSEEK_API_KEY: ""
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install 'pytest>=8.0'
      - name: Verify committed blob, native checkout, seal and Git clean/checkout filters
        run: >-
          python -m pytest -q --junitxml=frozen-ledger.xml
          tests/unit/test_frozen_rehearsal_ledger.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: frozen-ledger-results-${{ matrix.os }}
          path: frozen-ledger.xml

  core:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        repetition: [1, 2]
    timeout-minutes: 15
    env:
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
      LINKLOOM_RETRIEVAL_MODE: bm25
      PYTHONPATH: src:.:tests/integration
      GEMINI_API_KEY: ""
      DEEPSEEK_API_KEY: ""
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install core and test dependencies
        run: python -m pip install -e '.[dev]'
      - name: Verify launch entry points
        run: |
          python -m linkloom --help
          python -m linkloom.ui --help
      - name: Build wheel
        run: python -m pip wheel . --no-deps --wheel-dir work/wheels
      # Core is independent of historical experiment scores. Exact archived
      # synthetic inputs are replayed in the separate legacy-temporal job below.
      # All model interactions in these tests are injected fake adapters.
      # Grounding/TaskPlan also contain local LIVE-log replays. Select their
      # hermetic contracts explicitly; keep those historical tests unchanged.
      - name: Core product and safety regressions (no provider SDK or keys)
        run: >-
          python -m pytest -q -m 'not legacy_historical'
          -o junit_family=xunit1 --junitxml=offline-core.xml
          tests/integration/test_final_evidence_trust.py
          tests/unit/test_final_trust_boundary.py
          tests/unit/test_offline_source_controller.py
          tests/unit/test_source_identity_contract.py
          tests/unit/test_product_evidence_context_scope.py
          tests/unit/test_p84_durable_model_loop.py
          tests/unit/test_runtime_v2_multi_action.py
          tests/integration/test_runtime_v2_multi_action_resume.py
          tests/unit/test_runtime_v2_model_proposal.py
          tests/unit/test_progress_assessment.py
          tests/unit/test_recovery_policy.py
          tests/unit/test_graceful_partial_recovery.py
          tests/unit/test_recovery_passage_coverage.py
          tests/unit/test_context_assembler.py
          tests/unit/test_claim_grounding.py::test_supported_multi_hop_answer_uses_relation_specific_verified_lines
          tests/unit/test_claim_grounding.py::test_unparseable_claim_is_unverifiable_instead_of_lexically_accepted
          tests/unit/test_claim_grounding.py::test_claims_cannot_read_evidence_outside_their_own_citations
          tests/unit/test_claim_grounding.py::test_wrong_owner_and_partially_supported_atomic_claims_fail_closed
          tests/unit/test_phase3_task_plan.py::test_plan_requires_a_verified_read_before_dependent_entity_can_advance
          tests/unit/test_phase3_task_plan.py::test_one_verified_read_satisfies_independent_subgoals_that_found_same_passage
          tests/unit/test_phase3_task_plan.py::test_plan_rejects_same_quote_from_another_workspace_or_source
          tests/unit/test_phase3_task_plan.py::test_current_owner_conflict_in_chinese_plan_blocks_dependent_identity_without_extra_search
          tests/unit/test_phase3_task_plan.py::test_verified_current_conflict_guides_final_only_after_both_source_reads
          tests/unit/test_phase3_task_plan.py::test_empty_primary_and_alternate_mark_only_current_subgoal_blocked
          tests/unit/test_ui_projection.py
          tests/unit/test_agent_retrieval_v2_integration.py
          tests/unit/test_p84_recovery.py
          tests/unit/test_permission_gate.py
          tests/unit/test_temporal_decision_memory.py
          tests/unit/test_decision_memory_reconciliation.py
          tests/unit/test_runtime_v2_grounding_visibility.py
          tests/unit/test_semantic_ingestion_materialization.py
          tests/unit/test_bounded_multihop.py
          tests/integration/test_feedback_memory_flow.py
          tests/integration/test_bounded_multihop_flow.py
          tests/integration/test_unified_investigation_flow.py
          tests/integration/test_decision_discovery_flow.py
          tests/integration/test_product_application_flow.py
          tests/integration/test_stale_decision_revalidation.py
      - name: Ask DOM and JavaScript syntax
        if: always()
        run: |
          node --check src/linkloom/ui/static/product.js
          node --check src/linkloom/ui/static/product-task-result.js
          node tests/ui/task_answer_dom_test.cjs
          node tests/ui/unified_ask_dom_test.cjs
          node tests/ui/stale_revalidation_dom_test.cjs
          node tests/ui/first_use_dom_test.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: offline-core-results-${{ matrix.repetition }}
          path: offline-core.xml

  legacy-temporal:
    name: Legacy Historical Gate (original temporal fixtures)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
      LINKLOOM_RETRIEVAL_MODE: bm25
      PYTHONPATH: src:.:tests/integration
      GEMINI_API_KEY: ""
      DEEPSEEK_API_KEY: ""
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -e '.[dev]'
      - name: Verify and replay exact original synthetic inputs (no provider)
        run: >-
          python -m pytest -q -m legacy_historical --junitxml=legacy-temporal.xml
          tests/unit/test_legacy_temporal_inputs.py
          tests/integration/test_product_application_flow.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: legacy-temporal-results
          path: legacy-temporal.xml

  task-investigation:
    name: Task investigation (offline Product HTTP)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
      LINKLOOM_RETRIEVAL_MODE: bm25
      PYTHONPATH: src:.:tests/integration
      GEMINI_API_KEY: ""
      DEEPSEEK_API_KEY: ""
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -e '.[dev,smoke]'
      - name: Joint quote and Canary Runner contracts (no Provider)
        run: >-
          python -m pytest -q --junitxml=quote-runner.xml
          tests/unit/test_text_scopes.py
          tests/unit/test_quote_nesting_p2.py
          tests/unit/test_canary_quote_scopes.py
          tests/unit/test_quote_integration.py
          tests/unit/test_canary_trust_v2.py
          tests/unit/test_ami_canary_v2.py
          tests/unit/test_sprint_trust_v2.py
          tests/unit/test_canary_integration_contracts.py
          tests/unit/test_canary_source_gap_identity.py
      # Scripted wire transport; production F/G/Host/Runtime/Reviewer are used.
      # Keep this separate so the source_handles regression has a clear receipt.
      - name: M3-R Product semantic tool chain (offline, loopback HTTP only)
        run: >-
          python -m pytest -q --junitxml=m3r-semantic-chain.xml
          tests/integration/test_m3q_provider_host.py
          tests/unit/test_task_investigation_semantic_projection.py
          tests/unit/test_task_result_projection.py
          tests/unit/test_unified_ask.py
          tests/unit/test_tool_ledger_runtime.py::test_unknown_tool_does_not_create_pending_record
      - name: M3-S and S2 field binding and task recall
        run: >-
          python -m pytest -q --junitxml=m3s-field-recall.xml
          tests/unit/test_task_field_binding.py
          tests/unit/test_task_recall_protocol.py
      - name: M3-S1 bounded replanning through Runtime and Reviewer
        run: >-
          python -m pytest -q --junitxml=m3s1-replanning.xml
          tests/unit/test_m3s1_planning_context.py
          tests/integration/test_m3s1_ambiguous_product.py
      - name: M3-D combined F v3 and G replanning contracts
        run: >-
          python -m pytest -q --junitxml=m3d-combined.xml
          tests/integration/test_m3d_combined.py
      - name: P2-A work identity through Product HTTP and cold read
        run: >-
          python -m pytest -q --junitxml=p2a-work-identity.xml
          tests/unit/test_p2_work_identity.py
          tests/integration/test_p2_work_identity_http.py
      - name: P2-B Host ledger authentication and dependency replay
        run: >-
          python -m pytest -q --junitxml=p2b-inspect-ledger.xml
          tests/unit/test_inspect_ledger_host.py
          tests/integration/test_inspect_ledger_dependency.py
          tests/integration/test_inspect_ledger_cold_process.py
          tests/integration/test_inspect_ledger_nonpositive.py
          tests/integration/test_inspect_ledger_plan_binding.py
      - name: P2-A and P2-B joint Product execution
        run: >-
          python -m pytest -q --junitxml=p2-joint-product.xml
          tests/integration/test_p2_joint_product.py
      - name: Observation, planning, proof, context, Runtime and HTTP contracts
        run: >-
          python -m pytest -q --junitxml=task-investigation.xml
          tests/integration/test_task_answer_http.py
          tests/integration/test_m3d_combined.py
          tests/unit/test_call_bound_executor.py
          tests/unit/test_context_recovery_v1.py
          tests/unit/test_context_runtime_review_guards.py
          tests/unit/test_context_selection_v1.py
          tests/unit/test_investigation_planner_quality.py
          tests/unit/test_runtime_context_preflight.py
          tests/unit/test_runtime_context_sources.py
          tests/unit/test_semantic_context_builder.py
          tests/unit/test_semantic_invocation.py
          tests/unit/test_task_change_authority.py
          tests/unit/test_task_identity_resolution.py
          tests/unit/test_task_investigation_p4_steps.py
          tests/unit/test_task_offline_permissions.py
          tests/unit/test_task_observation.py
          tests/unit/test_task_observation_discovery.py
          tests/unit/test_task_plan_revision.py
          tests/unit/test_task_relation_candidates.py
          tests/unit/test_task_relation_query.py
          tests/unit/test_task_relation_question_planner.py
          tests/unit/test_task_relation_semantic.py
          tests/unit/test_task_relation_store.py
          tests/unit/test_task_relation_tools.py
          tests/unit/test_task_relations_p2.py
          tests/unit/test_task_revision_comparison.py
          tests/unit/test_m3q_provider_budget.py
          tests/unit/test_m3q_gemini_receipts.py
          tests/unit/test_m3q_cli_config.py
          tests/unit/test_m3q_semantic_polarity.py
          tests/integration/test_context_runtime_failures_resume.py
          tests/integration/test_context_runtime_integration.py
          tests/integration/test_m3p_product_review.py
          tests/integration/test_m3p_execution_failures.py
          tests/integration/test_semantic_recorded_runtime.py
          tests/integration/test_semantic_review_guards.py
          tests/integration/test_semantic_runtime_boundaries.py
          tests/integration/test_semantic_runtime_integration.py
          tests/integration/test_task_observation_flow.py
          tests/integration/test_task_relation_authority_readback.py
          tests/integration/test_task_relation_runtime.py
      - name: Explicit offline product entry
        run: python scripts/run_m3p_offline_acceptance.py --output work/ci-task-http
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: task-investigation-results
          path: |
            quote-runner.xml
            m3r-semantic-chain.xml
            m3s-field-recall.xml
            m3s1-replanning.xml
            m3d-combined.xml
            p2a-work-identity.xml
            p2b-inspect-ledger.xml
            p2-joint-product.xml
            task-investigation.xml
            work/ci-task-http
