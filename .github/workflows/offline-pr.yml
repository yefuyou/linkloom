name: CI

on:
  push:
    branches: [master, cleanup]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

env:
  OPENAI_API_KEY: ""
  OPENAI_BASE_URL: ""
  GOOGLE_API_KEY: ""
  GEMINI_API_KEY: ""
  DEEPSEEK_API_KEY: ""
  PYTHONUTF8: "1"

jobs:
  tests:
    name: Pytest (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: "3.11"
          - os: ubuntu-latest
            python: "3.12"
          - os: windows-latest
            python: "3.12"
          - os: macos-latest
            python: "3.12"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Install development dependencies
        run: pip install -e ".[dev]"
      - name: Run the full test suite
        run: pytest -q

  frontend-dom:
    name: Frontend DOM and JavaScript syntax
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check JavaScript syntax
        run: |
          node --check src/linkloom/ui/static/product.js
          node --check src/linkloom/ui/static/product-task-result.js
          node --check src/linkloom/ui/static/product-task-review.js
          node --check src/linkloom/ui/static/tasks.js
      - name: Run DOM tests
        run: |
          node tests/ui/task_review_dom_test.cjs
          node tests/ui/task_answer_dom_test.cjs
          node tests/ui/unified_ask_dom_test.cjs
          node tests/ui/stale_revalidation_dom_test.cjs
          node tests/ui/first_use_dom_test.cjs
          node tests/ui/product_copy_dom_test.cjs
          node tests/ui/tasks_dom_test.cjs
