[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "linkloom"
version = "0.1.0"
description = "Workspace-scoped team decision recovery and temporal evidence management"
requires-python = ">=3.11"
dependencies = ["PyYAML>=6.0", "rank-bm25==0.2.2", "python-dotenv>=1.0,<2"]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pydantic>=2,<3", "httpx>=0.27,<1", "google-genai==2.22.0", "openai>=1,<3"]
smoke = ["pytest>=8.0", "google-genai==2.22.0"]
retrieval = ["sentence-transformers>=5.0,<7.0"]
rerank = ["sentence-transformers>=6.2,<7", "huggingface-hub>=1.3,<3", "onnx>=1.17,<2", "onnxruntime>=1.20,<2", "psutil>=5.9,<8", "filelock>=3.13,<5", "httpx>=0.27,<1"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"linkloom.ui" = ["static/*", "demo_data/*.json", "demo_data/mps-001/*.md"]

[tool.pytest.ini_options]
pythonpath = ["src", ".", "tests/integration"]

