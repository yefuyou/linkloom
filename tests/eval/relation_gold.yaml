notes:
  - note_path: "tests/fixtures/relation_vault/0112-随笔.md"
    expected_topic_ids: ["agent-evaluation"]
    note_type: "learning"
    should_link_to_agent_evaluation: true
    evidence: 
      - "最终答案碰巧蒙对的情况比想象中多"
      - "中间跳过了校验步骤，等于是瞎猫碰上死耗子"
    difficulty: "easy"
    rationale: "记录了最终结果碰巧正确但中间步骤被跳过的现象，引出对过程合理性的疑问。"

  - note_path: "tests/fixtures/relation_vault/指标体系梳理.md"
    expected_topic_ids: ["agent-evaluation"]
    note_type: "learning"
    should_link_to_agent_evaluation: true
    evidence: 
      - "请求 payload 保留初始约束字段"
      - "空字符串 vs 字段缺失：目前当作相同处理"
    difficulty: "hard"
    rationale: "制定了条件留存和无据拦截的具体验证规则，内容是验证生成参数准确性的工程指标设计，未直接出现评测字眼。"

  - note_path: "tests/fixtures/relation_vault/灵感-关于状态丢失.md"
    expected_topic_ids: ["agent-evaluation"]
    note_type: "learning"
    should_link_to_agent_evaluation: true
    evidence: 
      - "开头埋限定条件，结尾看请求里还有没有"
      - "光看最终回复根本发现不了"
    difficulty: "hard"
    rationale: "记录了通过构造长对话陷阱来检测隐性状态丢失的想法，属于测试用例设计层面的思考。"

  - note_path: "tests/fixtures/relation_vault/Q1阶段性复盘.md"
    expected_topic_ids: ["agent-evaluation"]
    note_type: "project"
    should_link_to_agent_evaluation: true
    evidence: 
      - "异常路径下 B 先于 A 完成，拿到的画像参数为空"
      - "CI 增加节点顺序断言——节点被跳过或顺序反转时直接阻断合并"
    difficulty: "easy"
    rationale: "复盘了节点执行顺序倒置导致的线上故障，并提出通过 CI 节点断言进行自动化校验。"

  - note_path: "tests/fixtures/relation_vault/本周流水账-0418.md"
    expected_topic_ids: ["agent-evaluation"]
    note_type: "project"
    should_link_to_agent_evaluation: true
    evidence: 
      - "抽取中间每一跳的节点序列，跟预设的标准序列做 diff"
      - "之前是拿最终输出的字符串做相等比较，太脆"
    difficulty: "medium"
    rationale: "在混杂的一周工作记录中，记录了将结果字符串比较替换为节点序列 diff 的实际开发工作。"

  - note_path: "tests/fixtures/relation_vault/周二沟通记录.md"
    expected_topic_ids: ["agent-evaluation"]
    note_type: "interview"
    should_link_to_agent_evaluation: true
    evidence: 
      - "怎么在上线前就能验证每条路径还是对的"
      - "运行时的日志都是无结构的，要从里面还原出实际走了哪几步"
    difficulty: "easy"
    rationale: "记录了被追问如何在路径级别验证系统行为，以及对从无结构日志中还原步骤的思考。"

  - note_path: "tests/fixtures/relation_vault/面经-第二轮.md"
    expected_topic_ids: ["agent-evaluation"]
    note_type: "interview"
    should_link_to_agent_evaluation: true
    evidence: 
      - "扫描件先过 OCR 再走文本流程。如果检测到结构化表格，单独走表格解析"
      - "最多两轮，还是空就标记为缺失，不往库里写"
    difficulty: "hard"
    rationale: "讨论了文档处理流程中的工具路由选择、失败后的重试策略与停止条件、无依据字段的拦截，以及多环节同时出错时的归因方法。"

  - note_path: "tests/fixtures/relation_vault/下半年部门会议.md"
    expected_topic_ids: []
    note_type: "unrelated"
    should_link_to_agent_evaluation: false
    evidence: 
      - "再有因为漏测或者缺乏一致性评估出的严重事故"
      - "当期负责人的当季任务成功率直接按零分处理"
    difficulty: "hard"
    rationale: "包含一致性评估和任务成功率等词汇，但全篇讨论的是人员绩效考核和传统软件发版纪律。"

  - note_path: "tests/fixtures/relation_vault/0420-工作日志.md"
    expected_topic_ids: []
    note_type: "unrelated"
    should_link_to_agent_evaluation: false
    evidence: 
      - "核心页面的回归覆盖率到 80% 了"
      - "全量跑一遍要半小时以上，太慢"
    difficulty: "hard"
    rationale: "记录了回归覆盖率和执行耗时，但对象是前端 Cypress 页面自动化测试，与智能系统评测无关。"

  - note_path: "tests/fixtures/relation_vault/方案草案-v3.md"
    expected_topic_ids: []
    note_type: "unrelated"
    should_link_to_agent_evaluation: false
    evidence: 
      - "几亿条记录不可能割接当晚全量跑 diff"
      - "必须在 v3.4 版本发版前把降级方案在预发环境演练通过"
    difficulty: "hard"
    rationale: "使用了 diff、版本、降级等词汇，但实际讨论的是 MySQL 至 TiDB 数据库迁移的数据校验策略。"

