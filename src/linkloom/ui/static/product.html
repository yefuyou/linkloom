<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="light">
    <title>LinkLoom — Team Decision Memory</title>
    <link rel="icon" href="data:,">
    <link rel="stylesheet" href="/product.css">
  </head>
  <body>
    <a id="skip-content" class="skip-link" href="#main-content">Skip to content</a>
    <header class="topbar">
      <a class="brand" href="/tasks" aria-label="LinkLoom home"><span class="brand-mark" aria-hidden="true"></span><span>LinkLoom</span></a>
      <nav class="primary-nav" aria-label="主导航">
        <a href="/#meetings" data-screen="sources"><span class="nav-label">会议</span></a>
        <a href="/tasks" class="tasks-nav"><span id="tasks-nav-label" class="nav-label">待办</span></a>
        <a href="/#decisions" data-screen="decisions"><span class="nav-label">决定</span></a>
        <a href="/#ask" data-screen="ask"><span class="nav-label">提问</span></a>
      </nav>
      <div class="workspace-control">
        <label id="workspace-label" for="workspace-picker">Workspace</label>
        <select id="workspace-picker" aria-label="Select workspace"></select>
        <button class="button quiet" id="new-workspace" type="button">New workspace</button>
      </div>
      <div class="interface-language"><label id="interface-language-label" for="interface-language">Language</label><select id="interface-language"><option value="en">English</option><option value="zh">中文</option></select></div>
      <div id="provider-state" class="provider-state" role="status">Checking AI availability…</div>
      <span id="review-count" class="sr-only"></span>
    </header>
    <main id="main-content" class="page-shell" tabindex="-1">
      <div id="page" aria-live="polite"><section class="state-card"><p>Opening LinkLoom…</p></section></div>
    </main>
    <div class="sr-only" id="status-live" aria-live="polite" aria-atomic="true"></div>
    <script src="/product-task-result.js" defer></script>
    <script src="/product-task-review.js" defer></script>
    <script src="/product.js" defer></script>
  </body>
</html>
